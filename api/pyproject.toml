[project]
name = "dive2026-api"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
	"alembic==1.17.0",
	"asyncpg==0.30.0",
	"fastapi==0.119.0",
	"geoalchemy2>=0.18.0",
	"google-genai>=2.14.0",
	"httpx>=0.28.1",
	"pydantic-settings==2.12.0",
	"sqlalchemy[asyncio]>=2.0.50",
	"sqlmodel==0.0.27",
	"uvicorn==0.37.0",
]

[dependency-groups]
dev = ["ruff>=0.6", "ty>=0.0.4"]
test = [
	"pytest==9.0.3",
	"pytest-asyncio==1.4.0",
	"testcontainers==4.14.2",
	"pytest-cov==7.1.0",
]

[tool.ruff]
src = ["src", "scripts"]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py", "*/alembic/*", "*/main.py"]
