name: dive2026-https

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    init: true
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.azure}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:3000}
    command:
      - /bin/sh
      - /opt/dive/start-nginx.sh
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./deploy/nginx/start-nginx.sh:/opt/dive/start-nginx.sh:ro
      - ./deploy/nginx/http.conf.template:/opt/dive/http.conf.template:ro
      - ./deploy/nginx/https.conf.template:/opt/dive/https.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/nginx-health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  certbot-init:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    restart: "no"
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --email
      - ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env.azure}
      - --agree-tos
      - --no-eff-email
      - --keep-until-expiring
      - --non-interactive
      - -d
      - ${API_DOMAIN:?Set API_DOMAIN in .env.azure}
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    logging: *default-logging

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  letsencrypt:
  certbot_www:
