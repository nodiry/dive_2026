services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: dive
      POSTGRES_PASSWORD: dive
      POSTGRES_DB: dive2026
    ports:
      - "5433:5432"
    volumes:
      - dive_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dive -d dive2026"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dive_pg_data:
