services:
  db:
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: dive
      POSTGRES_PASSWORD: dive
      POSTGRES_DB: dive2026
    ports:
      - "5433:5432"
    volumes:
      - dive_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dive -d dive2026"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      # container-network DB address — overrides the host-oriented value in api/.env
      DATABASE_URL: postgresql+asyncpg://dive:dive@db:5432/dive2026
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/src/src

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./client/.env
    environment:
      # the browser (on the host) calls this, not another container — localhost:3000 is correct
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/repo/client/src
      - ./packages/shared/src:/repo/packages/shared/src

volumes:
  dive_pg_data:
